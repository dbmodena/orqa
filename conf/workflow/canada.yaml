seed: 42
source: ckan

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000

tasks:
  crawling:
    max_datasets: 50
    from_dataset_index: 0
    batch_fetch_metadata: 10
    accept_zip: True
    download_format: csv 
    engine: pandas
    max_resource_size: 20MB
    max_process_workers: 2
    max_thread_workers: 1
    verbose: True

  indexing:
    xash_size: 128
    max_process_workers: 2
    clean_func_args:
      level: 1
    top_k: 10
    verbose: True
  query_generation:
    kind: "PANDAS"
    max_cols: 10
    bad_tokens: ['s','None','R']
    max_response_tokens: 500

