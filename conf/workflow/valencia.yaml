seed: 42
source: ckan 
# Valencia is now CKAN-based (april 2026) but it seems that 
# up to few months ago it was OpendataSoft-based, and thus 
# several datasets follow conventions adopted by this different
# backend. For example, some of them use ";" instead of ","
# We thus need to handle these differences.

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000


polars:
  read:
    csv:
      separator: ","
      encoding: "utf-8"
  write:
    csv:
      separator: ","



blend:
  xash_size: 128
  max_cell_length: 128
  clean_args:
    lowercase: True
    bad_tokens:
      - "none"
      - "null"
      - "nan"
      - "na"
      - "n/a"
      - "not available"
      - "no data"
      - "(null)"
      - "no consta"
      - "no hi consta"

      # we do not want to filer all the punctuations, 
      # or to replace all the punctuations with empty 
      # strings or whatever; we just found that these 
      # values are pretty common, and that are not 
      # really useful for any analyses
      - "-"
      - "."
      - "*"
      - "---"
      - "€"

      # These values are extremely frequent (>10M rows)
      # but are likely to give less information, when 
      # considered as key elements
      # Maybe we will lost some possibility to identify
      # unionable tables, but we can take this risk
      # However, only during indexing these values are 
      # filtered, but are kept in original tables
      - "0"
      - "0.0"
      - "1"
      - "2"
      - "no"
      - "yes"

tasks:
  crawling:
    max_datasets: 5000
    from_dataset_index: 0
    batch_fetch_metadata: 10
    accept_zip: True
    download_format: csv 
    max_resource_size: 100MB
    max_workers: 8
    verbose: True

  cleaning:
    filter_filenames_patterns: 
      - "^varco.*"

    filter_column_patterns:
      # Identifiers
      - "^objectid$"
      
      # Geometric/Spatial columns
      - "geo_(point_2d|shape)$"
      - "^geom(_x_y)?$"

    try_separators:
      - ","
      - ";"

  indexing:
    max_process_workers: 4
    verbose: True

  candidates_discovery:
    n_random_dataset_seeds: 20
    min_dataset_height: 10
    limit_to_n_columns: 15
    sample_size: 3
    top_k_results_per_task: 10
    qcr_hash_size: 128
    n_paths_for_dataset: 5
    max_path_length: 5
    overlap_ratio_threshold: 50
    sm_macro_avg_threshold: 0.5
    sm_micro_avg_threshold: 0.5

  query_generation:
    kind: "SQL"
    max_cols: 10
    bad_tokens: ['s','None','R','NaN']
    max_response_tokens: 300
    max_memory_usage: 512
    max_pool_time: 60
    languages: ["Spanish"]
