seed: 0

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000

tasks:
  crawling:
    max_datasets: 2000
    from_dataset_index: 5000
    batch_fetch_metadata: 500
    accept_zip: False
    download_format: csv 
    engine: pandas
    max_resource_size: 20MB
    max_process_workers: 6
    max_thread_workers: 4
    verbose: True

  indexing:
    xash_size: 128
    max_process_workers: 2
    clean_func_args:
      level: 1
    top_k: 10
    verbose: True

  candidates_discovery:
    n_random_dataset_seeds: 5
    min_dataset_height: 10
    limit_to_n_columns: 15
    sample_size: 5

