seed: 42
source: ckan
flat_layout: true
write_path: "/home/bilel/gits/orqa/data/uk"

# Folder under this target's data directory that holds the tables every step
# after `clean` reads (index, candidates-discovery, query generation,
# benchmark). The download-format subfolder is still appended, so the default
# below resolves to <DATADIR>/orqa/ckan/uk/datasets/parquet — and, with
# flat_layout: true, to <DATADIR>/uk/datasets/parquet.
# Omit the key to get "datasets"; set it to point the run at a separately
# prepared table folder, e.g. "cleaned_datasets" -> .../cleaned_datasets/parquet.
# The crawler always downloads into the literal "datasets" folder regardless,
# so `crawl`/`clean` keep working when this is overridden.
table_dir: "clean_datasets"
pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000



# BLEND options (classical candidates-discovery pipeline)
blend:
  xash_size: 128
  max_cell_length: 128
  clean_args:
    lowercase: True
    bad_tokens:
      - "none"
      - "null"
      - "nan"
      - "na"
      - "n/a"
      - "not available"
      - "no data"
      - "(null)"

      # we do not want to filer all the punctuations, 
      # or to replace all the punctuations with empty 
      # strings or whatever; we just found that these 
      # values are pretty common, and that are not 
      # really useful for any analyses
      - "-"
      - "."
      - "*"

      # These values are extremely frequent (>10M rows)
      # but are likely to give less information, when 
      # considered as key elements
      # Maybe we will lost some possibility to identify
      # unionable tables, but we can take this risk
      # However, only during indexing these values are 
      # filtered, but are kept in original tables
      - "0"
      - "0.0"
      - "1"
      - "2"
      - "no"
      - "yes"
      - "ny"

tasks:
  crawling:
    max_datasets: 5000
    from_dataset_index: 0
    batch_fetch_metadata: 10
    accept_zip: True
    download_format: parquet 
    engine: pandas
    max_resource_size: 20MB
    max_workers: 4
    verbose: True

  indexing:
    max_process_workers: 2
    verbose: True

  candidates_discovery:
    # discovery pipeline: 'blend' (BLEND+SLOTH) or 'semantic' (embeddings+HNSW)
    method: semantic
    n_random_dataset_seeds: 20
    min_dataset_height: 10
    # Column-count ceiling for a table to enter the pipeline AT ALL. A table
    # WIDER than this is filtered out during indexing/embedding — treated
    # exactly like a table with no rows or no columns — so it never reaches
    # discovery or statement generation. Tables within the ceiling are shown
    # to the agent WHOLE (all columns), never as a vertical slice. Code
    # execution was never capped and still isn't.
    limit_to_n_columns: 20
    sample_size: 3
    n_paths_for_dataset: 5
    max_path_length: 5
    sm_macro_avg_threshold: 0.5
    sm_micro_avg_threshold: 0.5
    # Embedding + clustering discovery
    top_k_neighbors: 10
    cosine_similarity_threshold: 0.3
    correlation_threshold: 0.5
    correlation_method: pearson
    embedding_batch_size: 64
    target_cluster_size: 40
    cluster_overlap_margin: 0.1
    max_cluster_size: 60
    sm_matcher: coma
    tokens_budget: 1000000
    max_datasets_to_process: 100
  query_generation:
    kind: "SQL"
    max_response_tokens: 300
    max_memory_usage: 512
    max_pool_time: 60
    enable_single_table: "yes"
    single_table_query_count: 150
    multi_table_query_count: 100
    languages: ["English"]
    # Family-stratified sampling: no single CKAN dataset family (83% of UK
    # gold tables belong to one with other files, median 38, max 1,426)
    # contributes more than this many single-table candidates until every
    # family has had a turn.
    max_groups_per_family: 2
    # For each approved multi-table query, also generate one per-table
    # question DECOMPOSED from that query's own plan (each table's judged
    # "reason" — its business-level contribution to the question), e.g. a
    # January+February parking-tickets question yields a January-only and a
    # February-only reference question, each gated at mcp_search.
    # retrieval_contract.single_table_top_k. Logged as `reference_questions`
    # metadata on the approved query — never sampled as its own case.
    # False by default: costs one extra small LLM call per approved query.
    generate_reference_questions: false

  # Reverse-index backend — used by the plan judge's retrievability check and the solve-benchmark step (see orqa.benchmark.solve)
  mcp_search:
    backend: builtin  # local BM25 index under <data_path>/index/ — no external service needed
    elasticsearch_url: http://localhost:9200
    # Use the existing semantic-discovery metadata vectors to rerank the
    # complete lexical candidate set. Both components are normalized to
    # [0, 1] before fusion, and every search consumer uses this same index.
    hybrid_search_enabled: true
    lexical_weight: 0.5
    semantic_weight: 0.5
    # How lexical/semantic get combined (see orqa.benchmark.hybrid_index):
    # "weighted_score" (default, unchanged) averages the two normalized
    # scores using the weights above; "rrf" instead fuses on each side's
    # RANK (LakeGen's own Solr setup does this) — a candidate that ranks
    # #1 on EITHER side alone already scores well, no need to also be
    # strong on the other. lexical_weight/semantic_weight are ignored
    # under "rrf".
    fusion_method: weighted_score
    rrf_k: 60
    query_embedding_input_type: search_query
    query_embedding_cache_size: 2048
    # Adaptive top-K for the plan judge's keyword-searchability gate: each
    # plan's own K = round(number_of_tables_in_plan * this coefficient), so
    # a plan joining more tables is held to a wider net than a single-table
    # one instead of every plan sharing one fixed K.
    keyword_search_top_k_coefficient: 5.0
    # Whether the PRE-planning retrievability check (run once per table
    # group, before any LLM call) may abort a group as "unretrievable_group"
    # when its bounded metadata-vocabulary search cannot surface every table
    # within top-K.
    # False: the check still runs and still hands the planner a verified
    # keyword anchor when one is found — only the abort-on-failure half is
    # disabled, so an unresolved group just proceeds to planning without
    # an anchor instead of being skipped outright.
    gate_unretrievable_groups: false
    # Master on/off switch for the retrieval gate as a whole — the
    # PRE-planning keyword suggestion above AND the plan judge's reactive
    # keyword-searchability layer. Keep this enabled so hybrid retrieval is
    # actually used to generate and verify the suggested keyword anchor.
    retrieval_gate_enabled: true
    # Two-level retrievability contract (see
    # orqa.agent.utility.retrievability_gate): Level A checks a question's
    # CKAN dataset FAMILY is reachable by a panel of retrievers; Level B
    # checks the question states whatever distinguishes the gold FILE from
    # its same-family siblings (83% of UK gold tables have siblings, median
    # 38, max 1,426).
    retrieval_contract:
      enabled: true
      retrievers: [lexical_question, dense_question, llm_keywords]
      min_agreement: 2
      top_k_per_table: 10
      max_top_k: 20          # LakeGen's retrieval pool
      # Single-table plans (exactly one table) target literal rank 1
      # instead of the top_k_per_table/max_top_k window above — a keyword
      # combination that surfaces the table at all reaches rank 1 for no
      # extra search cost when there's only one target.
      single_table_top_k: 1
      max_residual_siblings: 30

  # Round-trip benchmark solver (step: solve-benchmark) — see
  # orqa.benchmark.solve / src/orqa/benchmark/readme.md.
  benchmark_solver:
    # How many candidate tables the reverse-index search retrieves per
    # question, and the scope of the pairwise Valentine relationship pass.
    top_k_tables: 10
    # Valentine matcher for that pairwise pass — schema-only and fast:
    # up to C(top_k_tables, 2) pairs get matched per question.
    matcher: similarity_flooding
  judges:
    plan_mode: mono
    code_mode: mono