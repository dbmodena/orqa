seed: 42
source: ckan

# Run log: every `src/main.py` run appends what it prints (colour codes
# stripped, a progress bar's final state) and its logging records (OrQA's
# from `level` up, libraries' from WARNING up), timestamped, to
# <write_path>/<dir>/<file>. The file rotates at `max_size` into <file>.1 and
# <file>.2 (`files` files in all); once they are all full the oldest is
# overwritten. The live log is always <file>. `dir` may also be absolute.
logging:
  enabled: true
  dir: log
  file: orqa.log
  max_size: 25MB
  files: 3
  level: INFO

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000


polars:
  read:
    csv:
      separator: ";"
  write:
    csv:
      separator: ","



# BLEND options (classical candidates-discovery pipeline)
blend:
  xash_size: 128
  max_cell_length: 128
  clean_args:
    lowercase: True
    bad_tokens:
      - "none"
      - "null"
      - "nan"
      - "na"
      - "n/a"
      - "not available"
      - "no data"
      - "(null)"

      # we do not want to filer all the punctuations, 
      # or to replace all the punctuations with empty 
      # strings or whatever; we just found that these 
      # values are pretty common, and that are not 
      # really useful for any analyses
      - "-"
      - "."
      - "*"

      # These values are extremely frequent (>10M rows)
      # but are likely to give less information, when 
      # considered as key elements
      # Maybe we will lost some possibility to identify
      # unionable tables, but we can take this risk
      # However, only during indexing these values are 
      # filtered, but are kept in original tables
      - "0"
      - "0.0"
      - "1"
      - "2"
      - "no"
      - "yes"

tasks:
  crawling:
    max_datasets: 5000
    from_dataset_index: 0
    batch_fetch_metadata: 10
    accept_zip: True
    download_format: csv 
    max_resource_size: 100MB
    max_workers: 8
    verbose: True

  indexing:
    max_process_workers: 4
    verbose: True

  candidates_discovery:
    # discovery pipeline: 'blend' (BLEND+SLOTH) or 'semantic' (embeddings+HNSW)
    method: blend
    n_random_dataset_seeds: 20
    min_dataset_height: 10
    limit_to_n_columns: 15
    sample_size: 3
    n_paths_for_dataset: 5
    max_path_length: 5
    sm_macro_avg_threshold: 0.5
    sm_micro_avg_threshold: 0.5
    # Embedding + clustering discovery
    top_k_neighbors: 10
    cosine_similarity_threshold: 0.3
    correlation_threshold: 0.5
    correlation_method: pearson
    embedding_batch_size: 64
    target_cluster_size: 40
    cluster_overlap_margin: 0.1
    max_cluster_size: 60
    sm_matcher: coma
    tokens_budget: 1000000
    max_datasets_to_process: 100
  query_generation:
    kind: "SQL"
    max_response_tokens: 300
    max_memory_usage: 512
    max_pool_time: 60
    languages: ["Spanish"]
    # Generation trace (orqa.utils.generation_trace): one folder per
    # generate-statements run with every question attempt (gate votes, judge
    # panel, feedback), every plan and plan-judge round, the generated code and
    # its validator/judge verdicts, every LLM call's outcome (the raw answer
    # when it failed), warnings, errors and crashed groups — written as it
    # happens, so a run killed mid-group keeps its trail. `dir` is relative to
    # write_path (or absolute); the folder gets its own `*` .gitignore.
    # Start with <dir>/latest/groups.jsonl (one line per group: status and
    # where it stopped), then grep events.jsonl by group.
    trace:
      enabled: true
      dir: log/generation
      # Every LLM call of a group, as sent and received, in
      # <run>/llm/<group>.txt: the user message, parameters, reasoning and raw
      # answer (each system prompt once in llm/system/), in call order, with
      # the outcome and errors above each call. all | failed (only attempts
      # that gave no usable answer) | off. About 0.6 MB per group.
      llm_io: all

  # Reverse-index backend — used by the question stage's retrievability gate
  search:
    backend: builtin  # local BM25 index under <data_path>/index/ — no external service needed

