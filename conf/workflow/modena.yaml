source: ckan
seed: 0

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000

tasks:
  crawling:
    max_datasets: 2000
    from_dataset_index: 0
    batch_fetch_metadata: 500
    accept_zip: False
    download_format: csv 
    engine: pandas
    max_resource_size: 100MB
    max_process_workers: 6
    max_thread_workers: 4
    verbose: True

  indexing:
    xash_size: 128
    max_process_workers: 12
    # max_queue_size: 2000
    clean_args:
      lowercase: True
      bad_tokens:
        - "none"
        - "null"
        - "nan"

        # we do not want to filer all the punctuations, 
        # or to replace all the punctuations with empty 
        # strings or whatever; we just found that these 
        # values are pretty common, and that are not 
        # really useful for any analyses
        - "-"
        - "."
    verbose: True

  candidates_discovery:
    n_random_dataset_seeds: 50
    min_dataset_height: 10
    limit_to_n_columns: 15
    sample_size: 3
    top_k_results_per_task: 30
    qcr_hash_size: 128
    n_paths_for_dataset: 5
    max_path_length: 5
    overlap_ratio_threshold: 0.5
