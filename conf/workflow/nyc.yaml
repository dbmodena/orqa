# New York City Scenario
# NYC Open Data are provided by Socrata, and some key differences with 
# CKAN cases have to be kept in mind. First, the metadata are quite different,
# since here we have column-level details, and we do not have anymore the 
# package-resource(s) semantic, we just have "datasets".

seed: 0

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000

tasks:
  crawling:
    max_datasets: 3000

    from_dataset_index: 0
    # batch_fetch_metadata: 500 # CKAN-only
    accept_zip: False
    download_format: csv 
    engine: pandas
    # max_resource_size: 20MB # CKAN-only
    max_rows_per_dataset: 100_000 # Socrata-only
    batch_rows_per_dataset: 10_000 # Socrata-only
    max_process_workers: 6
    max_thread_workers: 4
    verbose: True

  indexing:
    xash_size: 128
    max_process_workers: 12
    # max_queue_size: 2000
    clean_args:
      lowercase: True
      bad_tokens:
        - "none"
        - "null"
        - "nan"

        # we do not want to filer all the punctuations, 
        # or to replace all the punctuations with empty 
        # strings or whatever; we just found that these 
        # values are pretty common, and that are not 
        # really useful for any analyses
        - "-"
        - "."
    verbose: True

  candidates_discovery:
    n_random_dataset_seeds: 50
    min_dataset_height: 10
    limit_to_n_columns: 15
    sample_size: 3
    candidates_per_task: 30
    qcr_hash_size: 128

