seed: 42
source: ckan
flat_layout: true
write_path: "/home/bilel/gits/orqa/data/nyc"

# Folder under this target's data directory that holds the tables every step
# after `clean` reads (index, candidates-discovery, query generation,
# benchmark). The download-format subfolder is still appended, so the default
# below resolves to <DATADIR>/orqa/ckan/uk/datasets/parquet — and, with
# flat_layout: true, to <DATADIR>/uk/datasets/parquet.
# Omit the key to get "datasets"; set it to point the run at a separately
# prepared table folder, e.g. "cleaned_datasets" -> .../cleaned_datasets/parquet.
# The crawler always downloads into the literal "datasets" folder regardless,
# so `crawl`/`clean` keep working when this is overridden.
table_dir: "datasets"

# Run log: every `src/main.py` run appends what it prints (colour codes
# stripped, a progress bar's final state) and its logging records (OrQA's
# from `level` up, libraries' from WARNING up), timestamped, to
# <write_path>/<dir>/<file>. The file rotates at `max_size` into <file>.1 and
# <file>.2 (`files` files in all); once they are all full the oldest is
# overwritten. The live log is always <file>. `dir` may also be absolute.
logging:
  enabled: true
  dir: log
  file: orqa.log
  max_size: 25MB
  files: 3
  level: INFO

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000



# BLEND options (classical candidates-discovery pipeline)
blend:
  xash_size: 128
  max_cell_length: 128
  clean_args:
    lowercase: True
    bad_tokens:
      - "none"
      - "null"
      - "nan"
      - "na"
      - "n/a"
      - "not available"
      - "no data"
      - "(null)"

      # we do not want to filer all the punctuations, 
      # or to replace all the punctuations with empty 
      # strings or whatever; we just found that these 
      # values are pretty common, and that are not 
      # really useful for any analyses
      - "-"
      - "."
      - "*"

      # These values are extremely frequent (>10M rows)
      # but are likely to give less information, when 
      # considered as key elements
      # Maybe we will lost some possibility to identify
      # unionable tables, but we can take this risk
      # However, only during indexing these values are 
      # filtered, but are kept in original tables
      - "0"
      - "0.0"
      - "1"
      - "2"
      - "no"
      - "yes"
      - "ny"

tasks:
  crawling:
    max_datasets: 5000
    from_dataset_index: 0
    batch_fetch_metadata: 10
    accept_zip: True
    download_format: parquet 
    engine: pandas
    max_resource_size: 20MB
    max_workers: 4
    verbose: True

  indexing:
    max_process_workers: 2
    verbose: True

  candidates_discovery:
    # discovery pipeline: 'blend' (BLEND+SLOTH) or 'semantic' (embeddings+HNSW)
    method: semantic
    n_random_dataset_seeds: 20
    min_dataset_height: 10
    # Column-count ceiling for a table to enter the pipeline AT ALL. A table
    # WIDER than this is filtered out during indexing/embedding — treated
    # exactly like a table with no rows or no columns — so it never reaches
    # discovery or statement generation. Tables within the ceiling are shown
    # to the agent WHOLE (all columns), never as a vertical slice. Code
    # execution was never capped and still isn't.
    limit_to_n_columns: 20
    sample_size: 3
    n_paths_for_dataset: 5
    max_path_length: 5
    sm_macro_avg_threshold: 0.5
    sm_micro_avg_threshold: 0.5
    # Embedding + clustering discovery
    top_k_neighbors: 10
    # bge-m3's cosines run higher than cohere's: 0.81 keeps the 1.62 neighbors per table
    # cohere gave at 0.8 (measured 2026-11-07 on the same tables and clusters).
    cosine_similarity_threshold: 0.81
    correlation_threshold: 0.5
    correlation_method: pearson
    embedding_batch_size: 64
    # The metadata texts' model: bge-m3 on OrQA's embedding server (src/solr/embedder.py),
    # the model of the Solr cores; null: litellm.yaml's embedding_model.
    embedding_model: bge-m3
    embedding_url: null     # null: http://127.0.0.1:$ORQA_OLLAMA_PORT
    target_cluster_size: 40
    cluster_overlap_margin: 0.1
    max_cluster_size: 60
    sm_matcher: coma
    tokens_budget: 100_000_000
    max_datasets_to_process: 1000
  query_generation:
    kind: "SQL"
    max_response_tokens: 300
    max_memory_usage: 512
    max_pool_time: 60
    enable_single_table: "yes"
    # A sampled table that cannot be found within
    # search.retrieval_contract.single_table_top_k — no keyword search
    # places it (checked before any LLM call), or the question stage ends
    # "unretrievable_group" — is skipped: NO entry is written for it,
    # and its slot (st_5, ...) is refilled by the next table of the same seeded
    # order, up to 25 replacements per slot. Other failures are still recorded.
    single_table_query_count: 300
    multi_table_query_count: 200
    languages: ["English"]
    # Question generation is split from planning. For each slot an agent first
    # writes a question FROM the verified retrieval keywords (the anchor found by
    # searching the index) and a gate — the retriever panel, then the question
    # judges — approves it BEFORE any plan exists; the planner then plans the
    # frozen question, and the plan judges only judge the plan. A multi-table
    # question is gated per table: the lexical gate runs one keyword check per
    # table (does the question contain words that find it within
    # retrieval_contract.top_k_per_table? a check that also finds other tables
    # covers them) and counts as ONE vote next to dense_question and hybrid_rrf,
    # under min_agreement — not as one search that must find every table. Logged
    # per slot as `question_feedback`.
    # Rewrites a rejected question gets before its slot is dropped (5: on a
    # 6-table group the approved questions passed the judge on their 5th and
    # 6th attempt; 4 rounds ended with none).
    max_question_corrections: 5
    # Generation trace (orqa.utils.generation_trace): one folder per
    # generate-statements run with every question attempt (gate votes, judge
    # panel, feedback), every plan and plan-judge round, the generated code and
    # its validator/judge verdicts, every LLM call's outcome (the raw answer
    # when it failed), warnings, errors and crashed groups — written as it
    # happens, so a run killed mid-group keeps its trail. `dir` is relative to
    # write_path (or absolute); the folder gets its own `*` .gitignore.
    # Start with <dir>/latest/groups.jsonl (one line per group: status and
    # where it stopped), then grep events.jsonl by group.
    trace:
      enabled: true
      dir: log/generation
      # Every LLM call of a group, as sent and received, in
      # <run>/llm/<group>.txt: the user message, parameters, reasoning and raw
      # answer (each system prompt once in llm/system/), in call order, with
      # the outcome and errors above each call. all | failed (only attempts
      # that gave no usable answer) | off. About 0.6 MB per group.
      llm_io: all

  # Retrieval backend — what the keyword-anchor search and the question stage's
  # retrievability gate query.
  search:
    # This portal's core on OrQA's own Solr (src/solr, `python
    # src/solr/cli.py start`), the documents LakeGen searches, queried exactly as
    # LakeGen queries them (src/solr/index.py), so "retrievable" means
    # retrievable by LakeGen. The step build-solr-core builds the core. Keyword search: GET /<core>/select, edismax,
    # q.op=AND, the core's own qf. Dense: KNN on table_embedding through POST
    # /<core>/query (a 1024-d vector over GET is HTTP 414, and /select's edismax
    # default silently returns 0 hits), the question embedded with
    # solr.embedding_model at 1024 dims. Loading pings the core and checks its KNN
    # answers; a run fails rather than gate against anything else.
    solr:
      core: nyc
      url: null               # null: OrQA's Solr, http://localhost:$ORQA_SOLR_PORT/solr
      vector_field: table_embedding
      # The vectors' model: bge-m3 on OrQA's embedding server (src/solr/embedder.py),
      # as LakeGen embeds with it; cohere.* / ocid1.* would go through OCI.
      embedding_model: bge-m3
      embedding_url: null     # null: OrQA's embedding server, http://127.0.0.1:$ORQA_OLLAMA_PORT
      # Only metadata-v1 vectors of that model (LakeGen's KNN filters).
      knn_filters: ['representation_version:"metadata-v1"', 'embedding_model:"bge-m3"']
      embedding_dimensions: 1024  # the core's vectors; OrQA's 1536-d caches do not fit
      timeout: 30
      retries: 3
    # LRU cache of question embeddings for the KNN branch.
    query_embedding_cache_size: 2048
    # Adaptive top-K of the PRE-planning retrievability check for a multi-table
    # group: K = round(number_of_tables_in_group * this coefficient), so a group
    # of more tables is held to a wider net than a single table instead of every
    # group sharing one fixed K.
    keyword_search_top_k_coefficient: 5.0
    # Whether the PRE-planning retrievability check (run once per table
    # group, before any LLM call) may abort a group as "unretrievable_group"
    # when its bounded metadata-vocabulary search cannot surface every table
    # within top-K.
    # False: the check still runs and still hands the planner a verified
    # keyword anchor when one is found — only the abort-on-failure half is
    # disabled, so an unresolved group just proceeds to planning without
    # an anchor instead of being skipped outright.
    # (Single-table generation ignores this flag: a single table with no
    # keyword anchor in the top K is always skipped and replaced — see
    # tasks.query_generation.single_table_query_count.)
    gate_unretrievable_groups: false
    # Master on/off switch for the retrieval gate as a whole — the
    # PRE-planning keyword suggestion above AND the question stage's
    # retriever-panel gate. Off, no question is checked against Solr at all.
    retrieval_gate_enabled: true
    # Retrievability contract (see orqa.retrieval.gate): a
    # question passes when a panel of retrievers majority-agrees that it finds
    # every gold table within the top K. The retrievers are LakeGen's three
    # ways of querying the core:
    #   llm_keywords   -> keyword search. In the question stage it is replaced
    #     by the lexical gate, a deterministic check per table — the table's
    #     verified anchor keywords, or else the question's own words Solr
    #     matches on that table — together ONE vote.
    #   dense_question -> Solr KNN on the question's embedding.
    #   hybrid_rrf     -> Reciprocal Rank Fusion of the keyword and KNN
    #     rankings, as LakeGen's hybrid_rrf preset runs it.
    # (lexical_question, the raw question text as an OR query, is left out:
    # LakeGen searches keywords, never the question text.)
    retrieval_contract:
      enabled: true
      # q.op=AND, as LakeGen: one keyword the table lacks removes it. AND also
      # gives each table of a multi-table group its own anchor, since no single
      # AND query surfaces the whole group.
      keyword_match: all
      retrievers: [llm_keywords, dense_question, hybrid_rrf]
      hybrid_rrf_k: 60        # LakeGen's RRF constant
      hybrid_rrf_depth: 100   # each branch's top 100: LakeGen's top_k 20 x candidate_multiplier 5
      min_agreement: 2
      top_k_per_table: 10
      max_top_k: 20          # LakeGen's retrieval pool
      # Single-table plans (exactly one table) target literal rank 1
      # instead of the top_k_per_table/max_top_k window above — a keyword
      # combination that surfaces the table at all reaches rank 1 for no
      # extra search cost when there's only one target.
      single_table_top_k: 10

  judges:
    plan_mode: mono
    code_mode: mono