seed: 42
source: socrata

pandas:
  read:
    csv:
      nrows: 10_000
    json:
      nrows: 10_000



# BLEND options (classical candidates-discovery pipeline)
blend:
  xash_size: 128
  max_cell_length: 128
  clean_args:
    lowercase: True
    bad_tokens:
      - "none"
      - "null"
      - "nan"
      - "na"
      - "n/a"
      - "not available"
      - "no data"
      - "(null)"

      # we do not want to filer all the punctuations, 
      # or to replace all the punctuations with empty 
      # strings or whatever; we just found that these 
      # values are pretty common, and that are not 
      # really useful for any analyses
      - "-"
      - "."
      - "*"

      # These values are extremely frequent (>10M rows)
      # but are likely to give less information, when 
      # considered as key elements
      # Maybe we will lost some possibility to identify
      # unionable tables, but we can take this risk
      # However, only during indexing these values are 
      # filtered, but are kept in original tables
      - "0"
      - "0.0"
      - "1"
      - "2"
      - "no"
      - "yes"
      - "ny"

tasks:
  crawling:
    max_datasets: 5000
    from_dataset_index: 0
    batch_fetch_metadata: 10
    accept_zip: True
    download_format: csv 
    engine: pandas
    max_resource_size: 20MB
    max_workers: 4
    verbose: True

  cleaning:
    filter_column_patterns:
      - "^the_geom$"
      - "^location$"
      - "^polygon$"
      - "shape"
      - "^coordinates$"
      - "(brooklyn|manhattan|queens|bronx)_cooperatives_comparable_properties_address"
      - "(brooklyn|manhattan|queens|bronx)_condominium_property_address"
      - "comparable_rental_\\d_address"
      

  indexing:
    max_process_workers: 2
    verbose: True

  candidates_discovery:
    # discovery pipeline: 'blend' (BLEND+SLOTH) or 'semantic' (embeddings+HNSW)
    method: semantic
    n_random_dataset_seeds: 50
    min_dataset_height: 10
    limit_to_n_columns: 15
    sample_size: 3
    n_paths_for_dataset: 5
    max_path_length: 5
    sm_macro_avg_threshold: 0.5
    sm_micro_avg_threshold: 0.5
    # Embedding + clustering discovery
    top_k_neighbors: 10
    cosine_similarity_threshold: 0.35
    correlation_threshold: 0.5
    correlation_method: pearson
    embedding_batch_size: 64
    target_cluster_size: 40
    cluster_overlap_margin: 0.1
    max_cluster_size: 30
    sm_matcher: coma
    tokens_budget: 5000000
    max_datasets_to_process: 2000
  query_generation:
    kind: "PANDAS"
    max_response_tokens: 300
    max_memory_usage: 512
    max_pool_time: 60
    enable_single_table: "yes"
    single_table_query_count: 3
    multi_table_query_count: 4
    languages: ["English"]

  # MCP dataset-search server (step: mcp_search)
  mcp_search:
    backend: elasticsearch
    elasticsearch_url: http://localhost:9200
    host: 127.0.0.1
    port: 8765
    # Adaptive top-K for the plan judge's keyword-searchability gate: each
    # plan's own K = round(number_of_tables_in_plan * this coefficient), so
    # a plan joining more tables is held to a wider net than a single-table
    # one instead of every plan sharing one fixed K.
    keyword_search_top_k_coefficient: 9.0
    # Whether the PRE-planning retrievability check (run once per table
    # group, before any LLM call) may abort a group as "unretrievable_group"
    # when no keyword combination can surface every table within top-K.
    # False: the check still runs and still hands the planner a verified
    # keyword anchor when one is found — only the abort-on-failure half is
    # disabled, so an unresolved group just proceeds to planning without
    # an anchor instead of being skipped outright.
    gate_unretrievable_groups: false
    # Master on/off switch for the retrieval gate as a whole — the
    # PRE-planning keyword suggestion above AND the plan judge's reactive
    # keyword-searchability layer. False disables both outright, regardless
    # of whether a reverse index is otherwise available.
    retrieval_gate_enabled: false

  # How many judges vote on each panel (see orqa.agent.agents.JudgePanel).
  # judge_profiles.plan/code in conf/llm/litellm.yaml stay the pool of
  # CANDIDATE judge models (currently 3 each); this only caps how many of
  # them are actually used per run — independently for the plan panel
  # (judges a structured plan before any code is written) and the code
  # panel (judges the generated question/code/result triple).
  #   mono: use just the first configured judge — a single verdict, no
  #     voting. Cheaper and faster; no cross-model disagreement signal.
  #   trio: use the first three configured judges — majority vote.
  judges:
    plan_mode: mono
    code_mode: mono