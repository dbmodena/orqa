# LLM Configuration File

# Model to use (any LiteLLM-supported model)
# Examples:
#   - groq/llama-3.1-8b-instant
#   - groq/llama-3.1-70b-versatile
#   - openai/gpt-4
#   - anthropic/claude-3-sonnet
model: "groq/llama-3.1-8b-instant"
# model: "together_ai/togethercomputer/Llama-2-7B-32K-Instruct"

# Temperature (0.0 = deterministic, 2.0 = very creative)
temperature: 0.2

# Maximum number of retry attempts on failure
max_retries: 3

# Delay in seconds between retry attempts
# we set a high delay until we do not work 
# locally...
retry_delay: 10.0

# Enable JSON mode for structured outputs
# (requires model support for response_format)
enable_json_mode: true

# Optional: Additional model parameters
# max_tokens: 1000
# top_p: 1.0
# frequency_penalty: 0.0
# presence_penalty: 0.0

# Response model configuration
response_model:
  module: "structured_outputs"  # Python module where the model is defined
  class: "Result"  # Pydantic model class name
