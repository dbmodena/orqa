# LLM Configuration File
# Primary model (will be tried first)
model: "oci/openai.gpt-oss-120b"
# Fallback models (tried in order if primary fails)
fallback_models:
  - "groq/llama-3.3-70b-versatile"
# - "ollama_chat/llama3.1:8b"
#    - "groq/llama-3.3-70b-versatile"
#   - "groq/llama-3.1-8b-instant"
#  - "together_ai/togethercomputer/Llama-2-7B-32K-Instruct"

# Embedding model for candidates discovery (metadata embeddings).
# Must be multilingual: the portals include Italian, Spanish and French datasets.
embedding_model: "oci/cohere.embed-multilingual-v3.0"

# Provider-specific parameters
provider_params:
  ollama_chat:
    api_base: "http://localhost:11434"
    keep_alive: "24h"
    num_ctx: 16384
    response_format: 
      type: "json_object"
  groq:
    api_key:  os.environ/GROQ_API_KEY
    # Groq-specific params (if any)
    response_format: 
      type: "json_object"
  anthropic:
    api_key: os.environ/ANTHROPIC_API_KEY
    drop_params: true
    additional_drop_params: ["temperature"]
  together_ai:
    # TogetherAI-specific params (if any)
  oci:
    drop_params: true
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID
    #max_tokens: 4096
    timeout: 300
    # NOTE: no temperature override here on purpose. It's tempting to
    # assume OCI's reasoning models (openai.gpt-oss-120b/-20b,
    # google.gemini-2.5-flash) need a fixed temperature=1 while thinking,
    # the same real constraint Anthropic's extended thinking has above —
    # but that was tested directly (12 live completions across
    # temperature 0.1-1.0, both a trivial prompt and a real judge payload)
    # and disproven: identical behavior at every value, on both models.
    # The global `temperature: 0.1` a few lines up already applies to
    # every oci/* deployment with nothing overriding it here. If a genuine
    # per-model need shows up later, set it via the per-judge mapping form
    # in judge_profiles (or add a `temperature:` key back here) — and this
    # time, verify it against the live API before trusting the analogy.

# Common parameters (applied to all models)

max_retries: 3
temperature: 0.1
retry_delay: 10.0
enable_json_mode: true


# Judge panels: each panel is a list of small models that judge the same
# artifact independently; approval is decided by majority vote. Each entry is
# a LiteLLM model string (or a mapping with a "model" key plus per-judge
# overrides); its provider params are fetched from provider_params above by
# the model's provider prefix, exactly like the primary/fallback models.
# Prefer models from DIFFERENT families (votes only help when errors are
# decorrelated) and different from the generation model (self-bias).
# Remove/empty a panel to fall back to the single primary-model judge.
judge_profiles:
  # Judges the structured query plans (before code generation).
  plan:
    - "oci/openai.gpt-oss-120b"
    - "oci/openai.gpt-oss-20b"
    - "oci/google.gemini-2.5-flash"
    
  # Judges the generated (question, code, result) triples.
  code:
    - "oci/openai.gpt-oss-120b"
    - "oci/openai.gpt-oss-20b"
    - "oci/google.gemini-2.5-flash"
    

# Response model configuration
response_model:
  module: "utility.structured_outputs"  # Python module where the model is defined
  class: "Result"  # Pydantic model class name

querying: 
  module: "utility.structured_outputs"
  class: "QuerySet"

table_analyzer:
  module: "utility.structured_outputs"
  class: "TableAnalyses"

pair_task_selector:
  module: "utility.structured_outputs"
  class: "PairTaskSelection"

query_planner:
  module: "utility.structured_outputs"
  class: "QueryPlan"

fallback_querying:
  module: "utility.structured_outputs"
  class: "Query"

statement_judge:
  module: "utility.structured_outputs"
  class: "Judgments"

plan_judge:
  module: "utility.structured_outputs"
  class: "PlanJudgment"

# Benchmark solver (orqa.agent.agents.BenchmarkSolver) — three single-shot
# phases of the round-trip benchmark loop (orqa.benchmark.solve).
benchmark_search_keywords:
  module: "utility.structured_outputs"
  class: "SearchKeywords"

benchmark_table_selection:
  module: "utility.structured_outputs"
  class: "TableSelection"

benchmark_solver_code:
  module: "utility.structured_outputs"
  class: "SolverCode"

# Local Ollama setup
# model: ollama_chat/llama3.3:latest
# api_base: http://localhost:11434
# keep_alive: 24h
# num_ctx: 8192
