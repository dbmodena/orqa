# LLM Configuration File
# Primary model (will be tried first)
model: "oci/meta.llama-3.3-70b-instruct"
# Fallback models (tried in order if primary fails)
fallback_models:
   - "ollama_chat/llama3.1:8b"
   - "groq/llama-3.3-70b-versatile"
#   - "groq/llama-3.1-8b-instant"
#  - "together_ai/togethercomputer/Llama-2-7B-32K-Instruct"

# Provider-specific parameters
provider_params:
  ollama_chat:
    api_base: "http://localhost:11434"
    keep_alive: "24h"
    num_ctx: 16384
    response_format: 
      type: "json_object"
  groq:
    api_key:  os.environ/GROQ_API_KEY
    # Groq-specific params (if any)
    response_format: 
      type: "json_object"
  together_ai:
    # TogetherAI-specific params (if any)
  oci:
    drop_params: true
    oci_region: os.environ/OCI_REGION
    oci_user: os.environ/OCI_USER
    oci_fingerprint: os.environ/OCI_FINGERPRINT
    oci_tenancy: os.environ/OCI_TENANCY
    oci_key_file: os.environ/OCI_KEY_FILE
    oci_compartment_id: os.environ/OCI_COMPARTMENT_ID

# Common parameters (applied to all models)

max_retries: 3
temperature: 0.1
retry_delay: 10.0
enable_json_mode: true


# Response model configuration
response_model:
  module: "structured_outputs"  # Python module where the model is defined
  class: "Result"  # Pydantic model class name

querying: 
  module: "structured_outputs"
  class: "QuerySet"

table_analyzer: 
  module: "structured_outputs"
  class: "Result"

fallback_querying:
  module: "structured_outputs"
  class: "Query"

